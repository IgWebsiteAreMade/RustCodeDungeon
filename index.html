<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rust Dungeon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered phone-width column. Home is a sticky header, a quest card, then a vertical path of unit bands with level rows. A lesson is a fight: HP bar, arena, question, bottom dock. */
:root{
  color-scheme:dark;
  --bg:#14172a; --panel:#1f2440; --panel2:#2a3052; --line:#373e69;
  --text:#eceeff; --dim:#a4abd1;
  --accent:#ffb020; --accent-ink:#2a1a00; --accent-edge:#b57400;
  --good:#5fd99a; --good-bg:#163a2e; --good-edge:#2d9a64;
  --bad:#ff6b7a; --bad-bg:#43202f; --bad-edge:#b83a4a;
  --info:#7fb0ff; --sel-bg:#243061;
  --code-bg:#0e1122;
  --c-kw:#ff8fb1; --c-str:#9be58f; --c-com:#7f88b8; --c-num:#ffc66d; --c-mac:#7fd7ff; --c-ty:#c6a8ff;
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-pixel:'Press Start 2P',ui-monospace,Menlo,monospace;
  --font-code:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-ui);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse 90% 320px at 50% 0,rgba(255,176,32,.09),transparent 70%);
  background-repeat:no-repeat;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding-bottom:32px}
.spr{display:block;image-rendering:pixelated;height:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .spr{width:30px;flex:none}
.logo b{font:400 10px/1.5 var(--font-pixel);letter-spacing:.04em;text-transform:uppercase}
.stats{display:flex;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel);border:2px solid var(--line);border-radius:999px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.chip .spr{width:14px}

/* quest card */
.quest{margin-top:18px;padding:18px;background:var(--panel);border:2px solid var(--line);border-radius:16px;display:grid;gap:12px}
.rank{font:400 11px/1.4 var(--font-pixel);color:var(--accent);text-transform:uppercase}
.quest h1{margin:0;font-size:22px;line-height:1.2;font-weight:800;text-wrap:balance}
.quest p{margin:0;color:var(--dim)}
.xpbar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.xpnote{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:8px 16px}
.links a{color:var(--info);font-weight:700}

/* buttons */
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:14px;font-weight:800;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--accent-ink);background:var(--accent);box-shadow:0 4px 0 var(--accent-edge)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-edge)}
.btn:disabled{background:var(--panel2);color:var(--dim);box-shadow:0 4px 0 #20264a;cursor:not-allowed}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-edge);color:#04281a}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-edge);color:#3a0510}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}

/* units + levels */
.path{display:grid;gap:26px;margin-top:26px}
.unit{display:grid;gap:10px}
.uhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--u);color:#14172a}
.uhead .eb{font:400 9px/1.4 var(--font-pixel);text-transform:uppercase;opacity:.75;margin:0 0 6px}
.uhead h2{margin:0;font-size:20px;line-height:1.15;font-weight:800;text-wrap:balance}
.uhead p{margin:4px 0 0;font-size:14px;font-weight:600;opacity:.8}
.uhead .spr{width:54px;flex:none}
.uhead .cleared{font:400 8px/1.4 var(--font-pixel);text-transform:uppercase;background:#14172a;color:var(--u);padding:4px 6px;border-radius:6px;display:inline-block;margin-top:8px}
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;color:var(--text);cursor:pointer;min-width:0}
.lvl .node{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--dim);border:3px solid var(--line)}
.lvl .node svg{width:22px;height:22px}
.lvl .txt{min-width:0;flex:1}
.lvl b{display:block;font-size:16px;font-weight:800;line-height:1.25}
.lvl small{display:block;color:var(--dim);font-size:13px;font-weight:600}
.lvl .go{flex:none;font:400 9px/1 var(--font-pixel);padding:7px 8px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-transform:uppercase}
.lvl.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,176,32,.18)}
.lvl.cur .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl.done .node{background:var(--u);border-color:var(--u);color:#14172a}
.lvl.lock{opacity:.5;cursor:not-allowed}
.lvl:nth-of-type(even){margin-left:18px;width:calc(100% - 18px)}
.sec{display:grid;gap:26px}
.sechead{display:grid;gap:8px;padding-top:20px;border-top:2px dashed var(--line)}
.sechead .eb{font:400 10px/1.4 var(--font-pixel);color:var(--accent);text-transform:uppercase;margin:0}
.sechead h2{margin:0;font-size:26px;line-height:1.15;font-weight:800;text-wrap:balance}
.sechead p{margin:0;color:var(--dim)}
.secbar{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.secbar .xpbar{flex:1}
.lvl.boss{border-style:dashed}
.lvl.boss .node{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.lvl.boss.cur .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl.boss.done .node{background:var(--good);border-color:var(--good);color:#04281a}
.lvl .node .bs{width:30px;height:auto}
.foot{margin-top:34px;padding-top:18px;border-top:2px solid var(--line);display:grid;gap:12px;color:var(--dim);font-size:14px}
.foot a{color:var(--info);font-weight:700}
.reset{background:none;border:2px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.reset[data-armed]{border-color:var(--bad);color:var(--bad)}
.resets{display:flex;flex-wrap:wrap;gap:10px}

/* lesson */
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.xbtn{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:22px;height:22px}
.hpbar{flex:1;height:16px;border-radius:8px;background:var(--panel2);overflow:hidden;border:2px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--bad);transition:width .45s ease}
.hearts{display:flex;gap:4px;flex:none}
.hearts .spr{width:22px}
.arena{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 8px 0;border-bottom:4px solid var(--line);margin-bottom:18px}
.fighter{display:grid;justify-items:center;gap:4px;padding-bottom:6px}
.fighter .spr{width:56px}
.fighter.foe .spr{width:64px}
.fighter small{font:400 8px/1.4 var(--font-pixel);color:var(--dim);text-transform:uppercase}
@keyframes lungeR{0%{transform:translateX(0)}40%{transform:translateX(70px)}100%{transform:translateX(0)}}
@keyframes lungeL{0%{transform:translateX(0)}40%{transform:translateX(-70px)}100%{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.arena.good .hero{animation:lungeR .5s ease}
.arena.good .foe{animation:shake .4s .2s}
.arena.bad .foe{animation:lungeL .5s ease}
.arena.bad .hero{animation:shake .4s .2s}
.qtype{margin:0 0 6px;font:400 9px/1.4 var(--font-pixel);color:var(--info);text-transform:uppercase}
.prompt{margin:0 0 14px;font-size:20px;line-height:1.3;font-weight:800;text-wrap:balance}
code.ic{font:600 .86em var(--font-code);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--c-mac);white-space:nowrap}
.code{margin:0 0 14px;padding:12px 14px;background:var(--code-bg);border:2px solid var(--line);border-radius:12px;font:400 13.5px/1.6 var(--font-code);overflow-x:auto;white-space:pre;tab-size:4}
.code .k{color:var(--c-kw)}.code .s{color:var(--c-str)}.code .c{color:var(--c-com);font-style:italic}.code .n{color:var(--c-num)}.code .m{color:var(--c-mac)}.code .t{color:var(--c-ty)}
.blank{display:inline-block;min-width:3.2ch;padding:0 6px;border-bottom:3px solid var(--accent);background:rgba(255,176,32,.14);border-radius:4px;color:var(--accent);font-weight:600;vertical-align:baseline;white-space:pre}
.blank:empty::after{content:"\00a0\00a0\00a0"}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;color:var(--text);font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;min-width:0}
.opt .kc{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:400 10px/1 var(--font-pixel);color:var(--dim)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.mono .t{font:600 14px/1.4 var(--font-code)}
.opt.sel{border-color:var(--info);background:var(--sel-bg)}
.opt.sel .kc{border-color:var(--info);color:var(--info)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.line{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:16px}
.line:empty::before{content:"Tap the pieces below, in order";color:var(--dim);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:10px 12px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);color:var(--text);font:600 14px/1.2 var(--font-code);cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.tok.used{visibility:hidden}
.typein{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--code-bg);color:var(--text);font:600 18px var(--font-code)}
.typein:focus{border-color:var(--info);outline:none}
.typein.good{border-color:var(--good)}.typein.bad{border-color:var(--bad)}
.dock{position:sticky;bottom:0;background:var(--bg);margin-top:18px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.fb{display:grid;gap:10px;padding:14px;border-radius:14px;border:2px solid}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{font-size:18px;font-weight:800}
.fb.good strong{color:var(--good)}.fb.bad strong{color:var(--bad)}
.fb p{margin:0;font-size:15px}
.fb .ans{font-family:var(--font-code);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.learn h1{margin:0 0 12px;font-size:26px;line-height:1.15;font-weight:800;text-wrap:balance}
.learn .hero-foe{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.learn .hero-foe .spr{width:72px}
.learn p{margin:0 0 12px;max-width:65ch}
.end{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:30px}
.end .spr{width:96px}
.end .spr.dead{filter:grayscale(1) brightness(.7);transform:rotate(90deg);margin:20px 0}
.end h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;text-wrap:balance}
.end p{margin:0;color:var(--dim)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:14px 0}
.sgrid div{padding:12px 6px;background:var(--panel);border:2px solid var(--line);border-radius:14px}
.sgrid b{display:block;font:400 15px/1.2 var(--font-pixel);color:var(--accent);margin-bottom:6px;font-variant-numeric:tabular-nums}
.sgrid span{font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(8,10,20,.78)}
.modal .box{width:100%;max-width:380px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px}
.modal h2{margin:0;font-size:20px}.modal p{margin:0;color:var(--dim)}
.say{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--info);display:grid;place-items:center;cursor:pointer;padding:0}
.say svg{width:20px;height:20px}
.say.on{background:var(--info);color:#0b1230;border-color:var(--info)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.qhead .qtype{margin:0}
.lbar .say{margin-left:auto}
.fbhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fb .say{width:34px;height:34px}
details.voice{margin-top:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px}
details.voice summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:800;cursor:pointer}
details.voice summary::-webkit-details-marker{display:none}
details.voice summary svg{width:20px;height:20px;color:var(--info)}
details.voice summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:3px solid var(--dim);border-bottom:3px solid var(--dim);transform:rotate(45deg);transition:transform .2s}
details.voice[open] summary::after{transform:rotate(-135deg)}
.vbody{display:grid;gap:14px;padding:0 14px 16px}
.vbody label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.vbody label.vrow{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}
.vbody select{width:100%;min-width:0;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--code-bg);color:var(--text);font:600 15px var(--font-ui)}
.vbody input[type=range]{width:100%;accent-color:var(--accent)}
.vbody input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.vbody .btn{width:auto;justify-self:start;padding:10px 16px}
.vnote{margin:0;color:var(--dim);font-size:14px}
button.chip{font-family:inherit;color:var(--text);cursor:pointer}
.logo .spr.hsp{width:44px}
.fighter.hero .spr.hsp{width:104px}
.end .spr.hsp{width:140px}
.end .spr.hsp.dead{margin:34px 0}
.sgrid{grid-template-columns:repeat(4,1fr);gap:8px}
.sgrid b{font-size:13px}
.sgrid span{font-size:11px;letter-spacing:.03em}
.herocard{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;background:var(--panel);border:2px solid var(--line);border-radius:16px}
.herocard .hsp{width:96px;flex:none}
.herocard div{flex:1;min-width:0;display:grid}
.herocard b{font-size:16px}
.herocard span{color:var(--dim);font-size:14px}
.btn.small{width:auto;flex:none;padding:10px 14px;font-size:13px}
.shoptitle{font:400 11px/1.4 var(--font-pixel);text-transform:uppercase}
.stage{margin-top:14px;display:grid;justify-items:center;padding-top:18px;background:var(--panel);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stage .spr.hsp{width:min(260px,76%)}
.stage .floor{width:100%;height:16px;background:var(--panel2);border-top:3px solid var(--line)}
.shopmsg{margin:12px 0 0;min-height:22px;color:var(--dim);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.tab{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--dim);font-weight:800;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:grid;gap:8px;align-content:start;justify-items:center;text-align:center;padding:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;min-width:0}
.item.eq{border-color:var(--good);background:var(--good-bg)}
.item .spr.hsp{width:100%;max-width:150px}
.item b{font-size:15px;line-height:1.2}
.item .price{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim)}
.item .price .spr{width:14px}
.item .btn{padding:9px 10px;font-size:12px;letter-spacing:.03em}
.fdots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.fdot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--dim);font:800 14px var(--font-ui);display:grid;place-items:center;cursor:pointer;padding:0}
.fdot svg{width:16px;height:16px}
.fdot .spr{width:16px}
.fdot.cur{border-color:var(--accent);color:var(--accent)}
.fdot.done{background:var(--good);border-color:var(--good);color:#04281a}
.fq h1{margin:12px 0;font-size:26px;line-height:1.15;font-weight:800;text-wrap:balance}
.fq p{margin:0 0 12px;max-width:65ch}
.fq ol,.fq ul{margin:0 0 14px;padding-left:22px;display:grid;gap:8px}
.fq a{color:var(--info);font-weight:700}
.fq a.btn{color:var(--accent-ink)}
.fq a.btn.ghost{color:var(--text)}
.lab{margin:16px 0 8px;font:400 9px/1.4 var(--font-pixel);text-transform:uppercase;color:var(--dim)}
.code .ln{display:block}
.code .ln:empty{min-height:1.6em}
.code .ln.add{background:rgba(95,217,154,.16);margin:0 -14px;padding:0 14px;box-shadow:inset 3px 0 0 var(--good)}
.code.out{border-color:var(--good);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
a.btn{text-decoration:none;text-align:center}
.fmsg{min-height:22px;margin:0 0 10px;color:var(--dim);font-size:14px}
.predict{margin:6px 0 16px;padding:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px}
.predict .prompt{font-size:18px;margin:0 0 12px}
.predict .opt{margin-bottom:8px;background:var(--bg)}
.predict .opt.good{background:var(--good-bg)}
.predict .opt.bad{background:var(--bad-bg)}
.fq .pfb{margin:4px 0 0;min-height:22px;font-size:15px}
.fcast{display:flex;align-items:flex-end;justify-content:center;gap:24px;margin:14px 0 0}
.fcast .spr.hsp{width:128px}

.tips{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--dim);font-size:14px}

(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var md=function(s){return esc(s).replace(/`([^`]+)`/g,'<code class="ic">$1</code>')};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var RE=/(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|\b(fn|let|mut|if|else|match|loop|while|for|in|break|return|struct|impl|enum|self|true|false|const)\b|\b([A-Za-z_]\w*!)|\b(\d+(?:\.\d+)?)\b|\b(i32|f32|bool|String|Vec|Option|Some|None|Self|str|Enemy|Player|Fighter|Action)\b/g;
function hl(src){
  src=src.replace('___','');
  var out='',last=0,m;RE.lastIndex=0;
  while((m=RE.exec(src))){
    out+=esc(src.slice(last,m.index));
    var c=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'m':m[5]?'n':'t';
    out+='<span class="'+c+'">'+esc(m[0])+'</span>';last=RE.lastIndex;
  }
  out+=esc(src.slice(last));
  return out.replace(//g,'<span class="blank" id="blank"></span>');
}

/* ---------- pixel art ---------- */
function sprite(map,pal,cls){
  var h=map.length,w=map[0].length,r='';
  map.forEach(function(row,y){var x=0;while(x<w){var c=row[x];if(c==='.'||!pal[c]){x++;continue}var e=x;while(e<w&&row[e]===c)e++;r+='<rect x="'+x+'" y="'+y+'" width="'+(e-x)+'" height="1" fill="'+pal[c]+'"/>';x=e}});
  return '<svg class="spr '+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}

/* ---------- course content ---------- */
function ch(q,opts,why,o){return Object.assign({t:'choice',q:q,opts:opts,why:why},o||{})}
function od(q,ans,extra,why,join){return {t:'order',q:q,ans:ans,tokens:ans.concat(extra),why:why,join:join===undefined?' ':join}}

var UNITS=[
{title:'Wake Up, Hero',sub:'Print your first lines of Rust',color:'#5fd99a',foe:{name:'Slime',s:'slime',p:'green'},levels:[
 {title:'Your first line',learn:{
   text:['Every Rust program starts at a function called `main`. The code between its curly braces runs from top to bottom.','`println!` prints a line of text. Text goes inside double quotes, and most lines end with a semicolon.','Later lessons leave out `fn main()` to keep examples short, but the code always lives inside one.'],
   code:'fn main() {\n    println!("You wake up in a dungeon.");\n}'},
  qs:[
   ch('Which function does every Rust program start running from?',['main','start','run','begin'],'Rust always looks for `fn main()` as the starting point.',{m:1}),
   ch('Which word prints text to the screen?',['println','echo','say','write_text'],'`println!` prints a line. The `!` marks it as a macro.',{code:'fn main() {\n    ___!("A slime appears!");\n}',m:1}),
   od('Build the line that prints Hello, hero!',['println!(','"Hello, hero!"',')',';'],['echo(','}'],'Text sits inside quotes, inside the brackets, and the line ends with a semicolon.',''),
   ch('What goes at the end of most Rust statements?',[';',':','.',','],'A semicolon ends a statement.',{m:1})
  ]},
 {title:'Notes and slots',learn:{
   text:['Two slashes start a comment. The computer skips it, so you can leave notes for yourself.','Inside `println!`, the symbols `{}` are a slot. Rust fills it with the value that comes after the string.'],
   code:'// This is a note to myself\nprintln!("Gold: {}", 25);'},
  qs:[
   ch('Which line is a comment?',['// check the door','# check the door','-- check the door','<!-- check the door -->'],'Rust comments start with two slashes.',{m:1}),
   ch('What does this print?',['Gold: 25','Gold: {}','Gold: ','25'],'The `{}` slot is replaced by 25.',{code:'println!("Gold: {}", 25);',m:1}),
   ty('Type the two symbols that start a one-line comment.',['//'],'Two forward slashes.'),
   ch('One line in this code is missing something. What?',['The first println! needs a ; at the end','Nothing, it is fine','main needs a return','Bye must be in single quotes'],'Statements in the middle of a block need a semicolon.',{code:'fn main() {\n    println!("Hi")\n    println!("Bye");\n}'})
  ]}
]},
{title:'Hero Stats',sub:'Store health, gold and speed in variables',color:'#b69bff',foe:{name:'Bat',s:'bat',p:'bat'},levels:[
 {title:'Let it be',learn:{
   text:['`let` creates a variable, a named box that holds a value.','By default a variable cannot change. Add `mut` (short for mutable) when you want to change it later.'],
   code:'let hp = 100;\nlet mut gold = 0;\ngold = gold + 25;'},
  qs:[
   ch('Which keyword creates a variable?',['let','var','make','int'],'Rust uses `let`.',{m:1}),
   ch('This code fails to compile. Why?',['hp is not mutable, it needs let mut','hp must be a string','= is not allowed','100 is too big'],'Variables are fixed unless you write `mut`.',{code:'let hp = 100;\nhp = 90;'}),
   od('Make a changeable variable called gold that starts at 0.',['let','mut','gold','=','0',';'],['var','change'],'`let mut name = value;` makes a variable you can change.'),
   ty('Type the missing keyword so score can change.',['mut'],'`mut` makes the variable mutable.','let ___ score = 0;\nscore = score + 10;')
  ]},
 {title:'Types of loot',learn:{
   text:['Every value has a type. `i32` holds whole numbers, `f32` holds decimals, `bool` holds true or false, and `&str` holds text.','Game positions and speeds are usually `f32`, because a hero can stand at x = 3.75.'],
   code:'let hp: i32 = 100;\nlet speed: f32 = 2.5;\nlet alive: bool = true;\nlet name: &str = "Mira";'},
  qs:[
   ch('Which type stores a whole number like 100?',['i32','f32','bool','&str'],'`i32` is a whole number.',{m:1}),
   ch('Which type stores a position like 3.75?',['f32','i32','bool','&str'],'`f32` holds decimals.',{m:1}),
   ch('Which value fits a bool?',['true','"true"','1.5','yes'],'A bool is exactly `true` or `false`, with no quotes.',{m:1}),
   ch('Fill in the hero’s name.',['"Mira"','Mira',"'Mira'",'(Mira)'],'Text needs double quotes.',{code:'let name: &str = ___;',m:1})
  ]}
]},
{title:'Fork in the Corridor',sub:'Make your code choose with if and match',color:'#e9e0c6',foe:{name:'Skeleton',s:'skull',p:'bone'},levels:[
 {title:'If and else',learn:{
   text:['`if` runs a block only when its condition is true. `else` runs when it is not.','Compare with `==` (equal), `!=` (not equal), `<`, `>`, `<=` and `>=`. A single `=` assigns a value, so it is not a comparison.'],
   code:'let hp = 30;\nif hp < 50 {\n    println!("Low health!");\n} else {\n    println!("Feeling fine.");\n}'},
  qs:[
   ch('With hp = 30, which message prints?',['Low health!','Feeling fine.','Both','Nothing'],'30 is less than 50, so the `if` block runs.',{code:'let hp = 30;\nif hp < 50 {\n    println!("Low health!");\n} else {\n    println!("Feeling fine.");\n}'}),
   ch('Which checks that two values are equal?',['==','=','===','equals'],'`==` compares. A single `=` assigns.',{m:1}),
   od('Build the start of: if hp is at most 0.',['if','hp','<=','0','{'],['}','=>'],'`<=` means less than or equal to.'),
   ch('Which is a correct Rust if?',['if gold > 10 { }','if gold > 10 then { }','if gold > 10: ','when gold > 10 { }'],'Rust uses `if condition { ... }` with no `then` and no colon.',{m:1})
  ]},
 {title:'Match the door',learn:{
   text:['`match` compares one value against several patterns and runs the first one that fits.','The pattern `_` is the catch-all. It matches anything not listed above it.'],
   code:'let door = 2;\nmatch door {\n    1 => println!("Treasure!"),\n    2 => println!("A trap!"),\n    _ => println!("Empty room."),\n}'},
  qs:[
   ch('With door = 2, what prints?',['A trap!','Treasure!','Empty room.','Nothing'],'The pattern `2` matches.',{code:'let door = 2;\nmatch door {\n    1 => println!("Treasure!"),\n    2 => println!("A trap!"),\n    _ => println!("Empty room."),\n}'}),
   ch('In a match, what does _ mean?',['Any other value (the catch-all)','A blank comment','The first value','An error'],'`_` catches everything the earlier patterns missed.'),
   ch('With door = 7, what prints?',['Empty room.','Treasure!','A trap!','Compile error'],'7 matches neither 1 nor 2, so `_` runs.',{code:'let door = 7;\nmatch door {\n    1 => println!("Treasure!"),\n    2 => println!("A trap!"),\n    _ => println!("Empty room."),\n}'}),
   ty('Type the catch-all pattern.',['_'],'A single underscore.','match door {\n    1 => println!("Treasure!"),\n    ___ => println!("Nothing here."),\n}')
  ]}
]},
{title:'Endless Halls',sub:'Repeat actions with loops',color:'#7fb0ff',foe:{name:'Ghost',s:'ghost',p:'ghost'},levels:[
 {title:'Loop and while',learn:{
   text:['`loop` repeats forever until you write `break`. `while` repeats as long as its condition stays true.','Something inside a `while` must eventually make the condition false, or the loop never ends.'],
   code:'let mut hp = 3;\nwhile hp > 0 {\n    println!("Ouch! hp = {}", hp);\n    hp = hp - 1;\n}'},
  qs:[
   ch('Which keyword repeats code forever until you break out?',['loop','forever','repeat','again'],'`loop` runs until `break`.',{m:1}),
   ch('How many times does Ouch! print?',['3','2','4','0'],'hp is 3, then 2, then 1. At 0 the loop stops.',{code:'let mut hp = 3;\nwhile hp > 0 {\n    println!("Ouch! hp = {}", hp);\n    hp = hp - 1;\n}'}),
   ch('How do you leave a loop early?',['break','exit','stop','end loop'],'`break` jumps out of the loop.',{m:1}),
   ch('What is the bug here?',['hp never changes, so it loops forever','hp is not mutable','while needs parentheses','println! needs a number'],'Nothing inside the loop lowers hp.',{code:'let mut hp = 3;\nwhile hp > 0 {\n    println!("Ouch!");\n}'})
  ]},
 {title:'For each floor',learn:{
   text:['`for` walks through a range of numbers. `1..4` gives 1, 2, 3. The end is left out.','Write `1..=4` to include the end. That gives 1, 2, 3, 4.'],
   code:'for floor in 1..4 {\n    println!("Floor {}", floor);\n}'},
  qs:[
   ch('What does `for n in 1..4` count?',['1, 2, 3','1, 2, 3, 4','0, 1, 2, 3','2, 3, 4'],'The end of `..` is excluded.'),
   ch('Which range includes the 5?',['1..=5','1..5','1...5','1-5'],'`..=` includes the last number.',{m:1}),
   ch('How many times does Swing! print?',['5','4','6','0'],'`0..5` gives 0, 1, 2, 3, 4.',{code:'for _ in 0..5 {\n    println!("Swing!");\n}'}),
   od('Build a for loop header for floors 1 to 3, including 3.',['for','floor','in','1..=3','{'],['while','1..3'],'`1..=3` includes 3.')
  ]}
]},
{title:'Spell Book',sub:'Package actions into functions',color:'#55d6e6',foe:{name:'Spell Slime',s:'slime',p:'blue'},levels:[
 {title:'Cast a function',learn:{
   text:['`fn` defines a function. Its inputs are parameters, each with a type. `-> i32` says what it gives back.','The last line, written without a semicolon, is the value the function returns.'],
   code:'fn heal(hp: i32, potion: i32) -> i32 {\n    hp + potion\n}\n\nlet new_hp = heal(40, 25);'},
  qs:[
   ch('Which keyword defines a function?',['fn','func','def','function'],'Rust uses `fn`.',{m:1}),
   ch('What is new_hp?',['65','40','25','heal'],'40 + 25 = 65.',{code:'fn heal(hp: i32, potion: i32) -> i32 {\n    hp + potion\n}\n\nlet new_hp = heal(40, 25);'}),
   ch('What does `-> i32` say?',['The function returns an i32 number','The function takes an i32 arrow','The function is private','The function loops'],'The arrow names the return type.'),
   ch('Why is there no semicolon after hp + potion?',['Without ; the last line is the returned value','Functions cannot have semicolons','It is a comment','A function can only have one line'],'A semicolon would turn the value into a plain statement and nothing would be returned.')
  ]},
 {title:'Parameters and returns',learn:{
   text:['Every parameter needs a type. You call a function by writing its name and the values in brackets.','`if` can produce a value too, so each branch can end with the number to return.'],
   code:'fn deal_damage(base: i32, crit: bool) -> i32 {\n    if crit {\n        base * 2\n    } else {\n        base\n    }\n}'},
  qs:[
   ch('What does deal_damage(10, true) return?',['20','10','0','true'],'A crit doubles the base damage.'),
   ch('What does deal_damage(10, false) return?',['10','20','0','false'],'No crit, so the base damage comes back unchanged.'),
   ch('Which call is valid?',['add(2, 3)','add(2)','add("2", "3")','add 2 3'],'It needs exactly two `i32` values in brackets.',{code:'fn add(a: i32, b: i32) -> i32 {\n    a + b\n}',m:1}),
   od('Build a header: is_alive takes hp as an i32 and returns a bool.',['fn','is_alive','(hp: i32)','->','bool','{'],['=>','i32'],'Parameters go in brackets and the return type follows `->`.')
  ]}
]},
{title:'Hero Blueprint',sub:'Design your player with structs',color:'#ff8b9a',foe:{name:'Armored Skull',s:'skull',p:'redskull'},levels:[
 {title:'Build a struct',learn:{
   text:['A `struct` groups related values into one type. Your hero can hold a name, health and a position in one place.','Read a field with a dot, like `hero.hp`.'],
   code:'struct Player {\n    name: String,\n    hp: i32,\n    x: f32,\n    y: f32,\n}\n\nlet hero = Player {\n    name: String::from("Mira"),\n    hp: 100,\n    x: 0.0,\n    y: 0.0,\n};\nprintln!("{}", hero.hp);'},
  qs:[
   ch('Which keyword groups fields into your own type?',['struct','class','object','group'],'Rust uses `struct`.',{m:1}),
   ch('How do you read the hero’s hp?',['hero.hp','hero->hp','hero[hp]','hp.hero'],'Fields are read with a dot.',{m:1}),
   ch('What does the println! show?',['100','hp','Mira','0.0'],'`hero.hp` is 100.',{code:'let hero = Player {\n    name: String::from("Mira"),\n    hp: 100,\n    x: 0.0,\n    y: 0.0,\n};\nprintln!("{}", hero.hp);'}),
   ch('To change hero.hp later, how must hero be declared?',['let mut hero','let hero','const hero','It always can change'],'Changing any field needs `mut`.',{m:1})
  ]},
 {title:'Give it moves',learn:{
   text:['`impl` attaches methods to a struct. Inside, `self` is the value the method was called on.','`&self` only reads. `&mut self` can change the value. You call a method with a dot.'],
   code:'impl Player {\n    fn take_hit(&mut self, dmg: i32) {\n        self.hp = self.hp - dmg;\n    }\n    fn is_alive(&self) -> bool {\n        self.hp > 0\n    }\n}\n\nhero.take_hit(30);'},
  qs:[
   ch('Which keyword attaches methods to a struct?',['impl','method','extend','with'],'Methods live inside an `impl` block.',{m:1}),
   ch('Why does take_hit use &mut self?',['It changes the player’s hp','It prints the hp','It returns a number','It copies the player'],'`&mut self` allows the method to change fields.'),
   ch('hp is 100. What is hero.hp after take_hit(30)?',['70','100','30','130'],'100 - 30 = 70.'),
   ch('How do you call the method?',['hero.take_hit(30)','take_hit(hero, 30)','hero::take_hit 30','Player.take_hit(30)'],'Use a dot after the value.',{m:1})
  ]}
]},
{title:'Monster Manual',sub:'Model enemies with enums and Option',color:'#ffa45c',foe:{name:'Blood Bat',s:'bat',p:'redbat'},levels:[
 {title:'Kinds of enemy',learn:{
   text:['An `enum` is a value that is exactly one of several named kinds. Write a kind as `EnumName::Kind`.','`match` must cover every kind, or the code will not compile. That catches forgotten enemies for you.'],
   code:'enum Enemy {\n    Slime,\n    Bat,\n    Skeleton,\n}\n\nlet foe = Enemy::Bat;\nlet reward = match foe {\n    Enemy::Slime => 5,\n    Enemy::Bat => 8,\n    Enemy::Skeleton => 12,\n};'},
  qs:[
   ch('How do you write the Bat kind?',['Enemy::Bat','Enemy.Bat','Enemy->Bat','Bat::Enemy'],'Kinds use a double colon.',{m:1}),
   ch('foe is Enemy::Bat. What is reward?',['8','5','12','0'],'The Bat arm gives 8.'),
   ch('What if a match skips a kind and has no _ ?',['Compile error: not every case is covered','It runs fine','It picks the first arm','It returns 0'],'Rust makes you handle every case.'),
   ch('An enemy is exactly one of Slime, Bat or Skeleton. Which fits best?',['enum','struct','loop','fn'],'An `enum` is a choice between named kinds.',{m:1})
  ]},
 {title:'Maybe a key',learn:{
   text:['`Option` holds either `Some(value)` or `None`. Use it when something might be missing, like a key the hero may not have.','Rust has no null. You must `match` an Option, so you cannot forget the missing case.'],
   code:'fn find_key(has_key: bool) -> Option<i32> {\n    if has_key { Some(7) } else { None }\n}\n\nmatch find_key(true) {\n    Some(id) => println!("Key {}", id),\n    None => println!("No key."),\n}'},
  qs:[
   ch('Which two values can an Option hold?',['Some(value) and None','true and false','Ok and Err','Left and Right'],'It is either `Some` with a value inside, or `None`.',{m:1}),
   ch('What does find_key(true) print?',['Key 7','No key.','Key true','Nothing'],'`Some(7)` matches the first arm, and id is 7.'),
   ch('What does find_key(false) print?',['No key.','Key 7','Key 0','Compile error'],'`None` matches the second arm.'),
   ch('Why does Rust use Option instead of null?',['It forces you to handle the missing case','It is shorter to type','Rust has no numbers','Null is a keyword for loops'],'The compiler will not let you skip the `None` case.')
  ]}
]},
{title:'Backpack',sub:'Hold items in a Vec and borrow them safely',color:'#b4e55a',foe:{name:'Moss Ghost',s:'ghost',p:'mossghost'},levels:[
 {title:'Lists of loot',learn:{
   text:['A `Vec` is a growing list. `vec![]` makes one, `push` adds an item, and `len()` counts them.','Positions start at 0, so the first item is `bag[0]`.'],

{id:'results',title:'Traps and Errors',sub:'Handle things that can go wrong with Result',color:'#ff9a76',foe:{name:'Trap Skeleton',s:'skull',p:'purpskull'},levels:[
 {title:'Ok or Err',learn:{
   text:['`Result` is either `Ok(value)` when something worked, or `Err(error)` when it failed. Loading a level file is a good example.','Unlike `Option`, an `Err` carries a reason you can show or log. Use `match` to handle both cases.'],
   code:'fn open_door(has_key: bool) -> Result<i32, String> {\n    if has_key {\n        Ok(1)\n    } else {\n        Err(String::from("The door is locked"))\n    }\n}\n\nmatch open_door(false) {\n    Ok(room) => println!("Entered room {}", room),\n    Err(msg) => println!("Error: {}", msg),\n}'},
  qs:[
   ch('Which two values can a Result hold?',['Ok(value) and Err(error)','Some(value) and None','true and false','Yes and No'],'`Ok` means success, `Err` means failure.',{m:1}),
   ch('What does this print?',['Error: The door is locked','Entered room 1','Nothing','Entered room 0'],'`open_door(false)` returns the `Err`, so the second arm runs.',{code:'fn open_door(has_key: bool) -> Result<i32, String> {\n    if has_key { Ok(1) } else { Err(String::from("The door is locked")) }\n}\n\nmatch open_door(false) {\n    Ok(room) => println!("Entered room {}", room),\n    Err(msg) => println!("Error: {}", msg),\n}'}),
   ch('When is Result better than Option?',['When failing has a reason you want to report','When you need a loop','When the value is a bool','They are always the same'],'`Err` carries the reason, `None` carries nothing.'),
   ch('What does Ok(5) mean?',['The call worked and the value is 5','An error numbered 5','The call failed','5 attempts were made'],'`Ok` wraps a successful value.')
  ]},
 {title:'unwrap and the ? mark',learn:{
   text:['`unwrap()` gives you the value inside `Ok`, but if it is an `Err` the program crashes (it panics). That is fine for quick experiments, risky in a finished game.','`?` is a shortcut inside a function that returns a `Result`: on `Err` it returns that error right away, on `Ok` it gives you the value.'],
   code:'let room = open_door(true).unwrap();   // 1\n// open_door(false).unwrap() would crash!\n\nfn enter(has_key: bool) -> Result<i32, String> {\n    let room = open_door(has_key)?;   // Err returns early\n    Ok(room + 10)\n}'},
  qs:[
   ch('What happens when you unwrap() an Err?',['The program crashes (panics)','It returns 0','It is ignored','It becomes None'],'`unwrap` panics on `Err`.'),
   ch('What does ? at the end of a call do?',['Returns the error early, or gives the Ok value','Asks the player a question','Makes the value optional','Ignores errors'],'It either unwraps the `Ok` or returns the `Err` to the caller.'),
   ch('Which is safest in a finished game?',['Handle the Err with match','Use unwrap everywhere','Ignore the returned value','Delete the Err'],'Handling the `Err` keeps the game from crashing.'),
   ch('What is r?',['Ok(11)','Ok(1)','Err("locked")','11'],'`open_door(true)` is `Ok(1)`, then `enter` returns `Ok(1 + 10)`.',{code:'fn open_door(has_key: bool) -> Result<i32, String> {\n    if has_key { Ok(1) } else { Err(String::from("locked")) }\n}\n\nfn enter(has_key: bool) -> Result<i32, String> {\n    let room = open_door(has_key)?;\n    Ok(room + 10)\n}\n\nlet r = enter(true);',m:1})
  ]}

  function layer(draw){
    var g=[];for(var j=0;j<32;j++)g.push(new Array(32).fill(null));
    var P=function(px,py,c){if(px>=0&&px<32&&py>=0&&py<32)g[py][px]=c};
    var R=function(rx,ry,w,h,c){for(var j=0;j<h;j++)for(var i=0;i<w;i++)P(rx+i,ry+j,c)};
    draw(P,R);
    var add=[];
    for(var j=0;j<32;j++)for(var i=0;i<32;i++)if(!g[j][i]&&((j>0&&g[j-1][i])||(j<31&&g[j+1][i])||(i>0&&g[j][i-1])||(i<31&&g[j][i+1])))add.push([i,j]);
    add.forEach(function(a){g[a[1]][a[0]]=OUT});

var TTS=('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;
var VOICES=[],talking=false,curUtt=null;
function pickVoice(){
  var v=VOICES.filter(function(x){return x.voiceURI===S.voice.uri})[0];
  return v||VOICES.filter(function(x){return x.default})[0]||VOICES[0]||null;
}
function voiceOptions(){
  var cur=pickVoice();
  return VOICES.map(function(v){return '<option value="'+esc(v.voiceURI)+'"'+(cur&&cur.voiceURI===v.voiceURI?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>'}).join('');
}
function loadVoices(){
  if(!TTS)return;
  var all=TTS.getVoices()||[];
  VOICES=all.filter(function(v){return /^en/i.test(v.lang)});
  if(!VOICES.length)VOICES=all;
  var sel=$('#voiceSel');if(sel)sel.innerHTML=voiceOptions();
}
if(TTS){loadVoices();if(TTS.addEventListener)TTS.addEventListener('voiceschanged',loadVoices)}
function setSpeaking(on){talking=on;document.querySelectorAll('.say').forEach(function(b){b.classList.toggle('on',on)})}
function stopSpeak(){if(TTS){try{TTS.cancel()}catch(e){}}curUtt=null;setSpeaking(false)}
function speak(text){
  if(!TTS||!text)return;
  stopSpeak();
  var u=new SpeechSynthesisUtterance(text),v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
  u.rate=S.voice.rate;
  u.onend=u.onerror=function(){if(curUtt===u){curUtt=null;setSpeaking(false)}};
  curUtt=u;setSpeaking(true);
  try{TTS.speak(u)}catch(e){setSpeaking(false)}
}
function sayBtn(act){return TTS?'<button class="say" data-act="'+act+'" aria-label="Read aloud">'+ICON.speaker+'</button>':''}
function spokenCode(src){
  return String(src).replace('___',' blank ')
    .replace(/\/\/\s*/g,' comment, ')
    .replace(/println!/g,'print line')
    .replace(/vec!/g,'vec')
    .replace(/&&/g,' and ')
    .replace(/&mut\s/g,'borrow mutable ')
    .replace(/&/g,'borrow ')
    .replace(/::/g,' double colon ')
    .replace(/->/g,' arrow ')
    .replace(/=>/g,' fat arrow ')
    .replace(/\.\.=/g,' up to and including ')
    .replace(/\.\./g,' up to ')
    .replace(/==/g,' equals equals ')
    .replace(/!=/g,' not equals ')
    .replace(/<=/g,' less than or equal to ')
    .replace(/>=/g,' greater than or equal to ')
    .replace(/([A-Za-z])\.([A-Za-z])/g,'$1 dot $2')
    .replace(/(^|[\s(,])_(?=[\s,)=]|$)/g,'$1underscore ')
    .replace(/_/g,' ')
    .replace(/;/g,' semicolon. ')
    .replace(/\{\}/g,' curly braces ')
    .replace(/\{/g,' open curly. ')
    .replace(/\}/g,' close curly. ')
    .replace(/\(/g,' open bracket ')
    .replace(/\)/g,' close bracket ')
    .replace(/\[/g,' open square bracket ')
    .replace(/\]/g,' close square bracket ')
    .replace(/</g,' less than ')
    .replace(/>/g,' greater than ')
    .replace(/=/g,' equals ')
    .replace(/\+/g,' plus ')
    .replace(/\*+(?=[A-Za-z_])/g,' ')
    .replace(/\*/g,' times ')
    .replace(/\|/g,' pipe ')
    .replace(/\s-\s/g,' minus ')
    .replace(/:/g,' colon ')
    .replace(/"/g,' ')
    .replace(/\s+/g,' ').trim();
}
function say(s){return s.replace(/`([^`]+)`/g,function(_,c){return spokenCode(c)})}
function isMono(q){return !!(q.m||(q.code&&q.code.indexOf('___')>-1))}
function learnText(){var lv=L.lv.level;return lv.title+'. '+lv.learn.text.map(say).join(' ')+(lv.learn.code?' Example code. '+spokenCode(lv.learn.code):'')}
function questionText(){
  var q=L.lv.level.qs[L.q],t=say(q.q)+'.';
  if(q.code)t+=' Code. '+spokenCode(q.code)+'.';
  if(q.t==='choice'){L.view.perm.forEach(function(oi,p){t+=' Option '+(p+1)+'. '+(isMono(q)?spokenCode(q.opts[oi]):q.opts[oi])+'.'})}
  else if(q.t==='order'){t+=' Pieces: '+L.view.bank.map(function(id){return spokenCode(q.tokens[id])}).join(', ')+'.'}
  return t;
}

  (c.items||[]).forEach(function(id){var it=ITEM_BY[id];if(!it)return;S.owned[id]=1;S.eq[it.slot]=id;SHOP_TAB=it.slot;msg+='The '+it.name+' is yours and equipped. '});
  save();
  return {ok:true,msg:msg.trim()};
}
function shopAction(act,id){
  var it=ITEM_BY[id];if(!it)return;
  var sel='.item[data-item="'+id+'"] .btn:not(:disabled)';
  if(act==='buy'){
    if(S.owned[id])return;
    if(S.coins<it.price){renderShop('You need '+(it.price-S.coins)+' more coins for the '+it.name+'.',sel);return}
    S.coins-=it.price;S.owned[id]=1;S.eq[it.slot]=id;save();
    renderShop('Bought the '+it.name+'. It is on your hero now.',sel);
  }else if(act==='equip'){
    if(!S.owned[id])return;S.eq[it.slot]=id;save();renderShop('Equipped the '+it.name+'.',sel);
  }else if(act==='unequip'){
    if(it.slot==='armor')return;S.eq[it.slot]='';save();renderShop('Took off the '+it.name+'.',sel);
  }
}

/* ---------- lesson ---------- */
var L=null;
function heartsHTML(){var h='';for(var i=0;i<L.max;i++)h+=S_('heart',i<L.hearts?'heart':'heartoff');return h}
function startLevel(i){
  var lv=LEVELS[i];
  L={i:i,lv:lv,max:lv.recap?5:3,hearts:lv.recap?5:3,queue:lv.level.qs.map(function(_,k){return k}),done:new Set(),wrong:new Set(),first:0,total:lv.level.qs.length,q:0,view:{}};
  show('lesson');renderLearn();
}
function topbar(){return '<div class="lbar"><button class="xbtn" data-act="quit" aria-label="Leave lesson">'+ICON.x+'</button><div class="hpbar" role="progressbar" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="100"><i id="hp" style="width:100%"></i></div><div class="hearts" id="hearts" aria-label="Hearts left">'+heartsHTML()+'</div></div>'}
function renderLearn(){
  var u=L.lv.unit,lv=L.lv.level;
  var h='<div class="lbar"><button class="xbtn" data-act="quit" aria-label="Leave lesson">'+ICON.x+'</button><span class="qtype" style="margin:0">'+(L.lv.recap?'Section recap':'Unit '+u.no+' · Level '+(L.lv.li+1))+'</span>'+sayBtn('say-learn')+'</div>';
  h+='<div class="learn"><div class="hero-foe">'+S_(u.foe.s,u.foe.p)+'<div><p class="qtype" style="margin:0">Enemy ahead: '+esc(u.foe.name)+'</p></div></div><h1>'+esc(lv.title)+'</h1>';
  lv.learn.text.forEach(function(t){h+='<p>'+md(t)+'</p>'});
  h+=(lv.learn.code?'<pre class="code">'+hl(lv.learn.code)+'</pre>':'')+'</div>';
  h+='<div class="dock"><button class="btn" data-act="fight">Fight the '+esc(u.foe.name)+'</button></div>';
  setTimeout(function(){stopSpeak();if(S.voice.auto&&L)speak(learnText())},0);
  $('#lesson').innerHTML=h;window.scrollTo(0,0);
}
function startFight(){
  var u=L.lv.unit;
  $('#lesson').innerHTML=topbar()+'<div class="arena" id="arena"><div class="fighter hero">'+heroSVG('')+'<small>You</small></div><div class="fighter foe">'+S_(u.foe.s,u.foe.p)+'<small>'+esc(u.foe.name)+'</small></div></div><div id="qbox"></div><div class="dock" id="dock"></div>';
  L.q=L.queue.shift();renderQ();
}
function updateBar(){
  $('#hp').style.width=(100-Math.round(L.done.size/L.total*100))+'%';
  $('#hearts').innerHTML=heartsHTML();
}
function dock(h){$('#dock').innerHTML=h}
function renderQ(){
  var q=L.lv.level.qs[L.q];
  L.view={sel:null,built:[],text:'',fb:false};
  var label={choice:'Pick the answer',order:'Build the line',type:'Type it'}[q.t];
  var h='<div class="qhead"><p class="qtype">'+label+'</p>'+sayBtn('say-q')+'</div><h2 class="prompt">'+md(q.q)+'</h2>';
  if(q.code)h+='<pre class="code">'+hl(q.code)+'</pre>';
  if(q.t==='choice'){
    L.view.perm=shuffle(q.opts.map(function(_,i){return i}));
    var mono=q.m||(q.code&&q.code.indexOf('___')>-1);
    L.view.perm.forEach(function(oi,pos){h+='<button class="opt'+(mono?' mono':'')+'" data-act="pick" data-i="'+pos+'"><span class="kc">'+(pos+1)+'</span><span class="t">'+esc(q.opts[oi])+'</span></button>'});
  }else if(q.t==='order'){
    var b;do{b=shuffle(q.tokens.map(function(_,i){return i}))}while(b.slice(0,q.ans.length).every(function(id,k){return q.tokens[id]===q.ans[k]}));
    L.view.bank=b;h+='<div class="line" id="line"></div><div class="bank" id="bank"></div>';
  }else{
    h+='<input class="typein" id="typein" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Type here">';
  }
  $('#qbox').innerHTML=h;
  dock('<button class="btn" id="check" data-act="check" disabled>Check</button>');
  if(q.t==='order')renderOrder();
  stopSpeak();if(S.voice.auto)speak(questionText());
  if(q.t==='type'){var inp=$('#typein');inp.addEventListener('input',function(){L.view.text=inp.value;var bl=$('#blank');if(bl)bl.textContent=inp.value.trim();$('#check').disabled=!inp.value.trim()});if(window.matchMedia&&!matchMedia('(pointer:coarse)').matches)inp.focus()}
}
function renderOrder(){
  var q=L.lv.level.qs[L.q],v=L.view;
  $('#line').innerHTML=v.built.map(function(id,pos){return '<button class="tok" data-act="untok" data-i="'+pos+'">'+esc(q.tokens[id])+'</button>'}).join('');
  $('#bank').innerHTML=v.bank.map(function(id){var used=v.built.indexOf(id)>-1;return '<button class="tok'+(used?' used':'')+'" data-act="tok" data-i="'+id+'"'+(used?' tabindex="-1" aria-hidden="true"':'')+'>'+esc(q.tokens[id])+'</button>'}).join('');
  var c=$('#check');if(c)c.disabled=v.built.length===0;
}
var norm=function(s){return String(s).trim().replace(/\s+/g,' ')};
function check(){
  var q=L.lv.level.qs[L.q],v=L.view;if(v.fb)return;
  var ok=false,ans='';
  if(q.t==='choice'){if(v.sel===null)return;ok=v.perm[v.sel]===0;ans=q.opts[0]}
  else if(q.t==='order'){if(!v.built.length)return;ok=v.built.map(function(id){return q.tokens[id]}).join('\u0001')===q.ans.join('\u0001');ans=q.ans.join(q.join)}
  else{if(!norm(v.text))return;ok=q.accept.some(function(a){return norm(a)===norm(v.text)});ans=q.accept[0]}
  v.fb=true;
  if(q.t==='choice'){document.querySelectorAll('.opt').forEach(function(b,pos){b.disabled=true;if(v.perm[pos]===0)b.classList.add('good');else if(pos===v.sel&&!ok)b.classList.add('bad')})}
  if(q.t==='order'){document.querySelectorAll('.tok').forEach(function(b){b.disabled=true})}
  if(q.t==='type'){var ti=$('#typein');ti.readOnly=true;ti.classList.add(ok?'good':'bad')}
  if(ok){L.done.add(L.q);if(!L.wrong.has(L.q))L.first++}
  else{L.hearts--;L.wrong.add(L.q);L.queue.push(L.q)}
  updateBar();hit(ok?'good':'bad');
  L.fbText=(ok?'Correct. ':'Not quite. The answer is '+((q.t==='choice'&&!isMono(q))?ans:spokenCode(ans))+'. ')+say(q.why);
  if(S.voice.auto)speak(L.fbText);
  var last=L.hearts<=0;
  dock('<div class="fb '+(ok?'good':'bad')+'"><div class="fbhead"><strong>'+(ok?['Direct hit!','Nice swing!','Critical!','Clean strike!'][Math.floor(Math.random()*4)]:'Ouch, not quite')+'</strong>'+sayBtn('say-fb')+'</div>'
    +(ok?'':'<p class="ans">'+esc(ans)+'</p>')+'<p>'+md(q.why)+'</p></div>'
    +'<button class="btn '+(ok?'good':'bad')+'" id="next" data-act="next">'+(last?'Continue':'Continue')+'</button>');
  var n=$('#next');if(n)n.focus({preventScroll:true});
}
function hit(kind){var a=$('#arena');if(!a)return;a.classList.remove('good','bad');void a.offsetWidth;a.classList.add(kind)}
function next(){
  if(L.hearts<=0)return renderEnd(false);
  if(!L.queue.length)return renderEnd(true);
  L.q=L.queue.shift();renderQ();window.scrollTo(0,0);
}
function renderEnd(win){
  stopSpeak();
  var u=L.lv.unit,h='';
  if(win){
    var first=!S.done[L.lv.key],flawless=L.wrong.size===0;
    var xp=first?20+5*L.first+(flawless?10:0):10;
    var coins=first?10+2*L.first+(flawless?10:0)+(L.lv.recap?25:0):5+L.first;
    S.xp+=xp;S.coins+=coins;S.done[L.lv.key]=1;touchStreak();save();
    var acc=Math.round(L.first/L.total*100);
    var rc=L.lv.recap?RECAP_CODES[SECTIONS[L.lv.sec].id]:'',rcBox=rc?'<div class="codebox"><span>Secret code found</span><b>'+rc+'</b><small>'+(S.codes[rc]?'You already redeemed this one.':'Redeem it in the shop for a reward.')+'</small></div>':'';
    h='<div class="end"><p class="qtype">Victory</p>'+S_(u.foe.s,u.foe.p,'dead')+'<h1>'+esc(u.foe.name)+' defeated</h1><p>'+(first?'Level cleared.':'Nice practice round.')+'</p>'
      +'<div class="sgrid"><div><b>+'+xp+'</b><span>XP</span></div><div><b>+'+coins+'</b><span>Coins</span></div><div><b>'+acc+'%</b><span>First try</span></div><div><b>'+L.hearts+'/'+L.max+'</b><span>Hearts</span></div></div>'+rcBox+'</div>'
      +'<div class="dock"><button class="btn good" data-act="home">Continue</button>'+(rc&&!S.codes[rc]?'<button class="btn ghost" data-act="redeem" data-code="'+rc+'">Redeem the code</button>':'<button class="btn ghost" data-act="shop">Spend coins in the shop</button>')+'</div>';
  }else{
    h='<div class="end"><p class="qtype" style="color:var(--bad)">Knocked out</p>'+heroSVG('dead')+'<h1>The '+esc(u.foe.name)+' wins this round</h1><p>Read the lesson notes again and have another go. Mistakes are how this sticks.</p></div>'
      +'<div class="dock"><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="home">Back to the map</button></div>';
  }
  $('#lesson').innerHTML=h;window.scrollTo(0,0);
}
function goHome(){stopSpeak();L=null;renderHome();show('home')}
function quitModal(){
  var m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Leave this fight?</h2><p>You will lose your progress in this lesson.</p><button class="btn" data-act="stay">Keep fighting</button><button class="btn ghost" data-act="leave">Leave</button></div>';
  document.body.appendChild(m);
}
function closeModal(){var m=$('#modal');if(m)m.remove()}

/* ---------- events ---------- */
var resetTimer=null;
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var act=el.getAttribute('data-act'),i=el.getAttribute('data-i');
  if(act==='start')startLevel(+i);
  else if(act==='fight')startFight();
  else if(act==='pick'){
    if(L.view.fb)return;L.view.sel=+i;
    document.querySelectorAll('.opt').forEach(function(b,p){b.classList.toggle('sel',p===+i)});
    var bl=$('#blank');if(bl)bl.textContent=L.lv.level.qs[L.q].opts[L.view.perm[+i]];
    $('#check').disabled=false;
  }
  else if(act==='tok'){if(L.view.fb)return;if(L.view.built.indexOf(+i)===-1){L.view.built.push(+i);renderOrder()}}
  else if(act==='untok'){if(L.view.fb)return;L.view.built.splice(+i,1);renderOrder()}
  else if(act==='say-learn'||act==='say-q'||act==='say-fb'||act==='voice-test'){
    if(talking&&act!=='voice-test'){stopSpeak();return}
    speak(act==='say-learn'?learnText():act==='say-q'?questionText():act==='say-fb'?L.fbText:'Hello hero. This is how I will read your lessons.');
  }
  else if(act==='check')check();
  else if(act==='next')next();
  else if(act==='retry')startLevel(L.i);
  else if(act==='shop'){stopSpeak();renderShop();show('shop')}
  else if(act==='redeem'){stopSpeak();SHOP_PREFILL=el.getAttribute('data-code')||'';renderShop(null,'#codein');show('shop')}
  else if(act==='shop-back')goHome();
  else if(act==='final'){stopSpeak();FPAGE=Math.min(Math.max(+S.final.at||0,0),FINAL_STEPS.length-1);renderFinal();show('final')}
  else if(act==='fgo'){FPAGE=+i;S.final.at=FPAGE;save();renderFinal();window.scrollTo(0,0)}
  else if(act==='fnext'){var FP=FINAL_STEPS[FPAGE];if(FP.kind==='step')S.final.done[FP.n]=1;FPAGE=Math.min(FPAGE+1,FINAL_STEPS.length-1);S.final.at=FPAGE;save();renderFinal();window.scrollTo(0,0)}
  else if(act==='fback'){FPAGE=Math.max(FPAGE-1,0);S.final.at=FPAGE;save();renderFinal();window.scrollTo(0,0)}
  else if(act==='fpick'){var FQ=FINAL_STEPS[FPAGE];if(FPICK[FQ.n]===FQ.ask.a)return;FPICK[FQ.n]=+i;renderFinal(null,'.predict .opt[data-i="'+i+'"]')}
  else if(act==='fcopy')copyCode();
  else if(act==='fclaim')claimFinal();
  else if(act==='say-final'){if(talking){stopSpeak();return}speak(finalSpeech())}
  else if(act==='tab'){SHOP_TAB=el.getAttribute('data-id');renderShop(null,'#tab-'+SHOP_TAB)}
  else if(act==='buy'||act==='equip'||act==='unequip')shopAction(act,el.getAttribute('data-id'));
  else if(act==='home')goHome();
  else if(act==='quit')quitModal();
  else if(act==='stay')closeModal();
  else if(act==='leave'){closeModal();goHome()}
  else if(act==='reset'||act==='reset-all'){
    var disarm=function(){document.querySelectorAll('.reset').forEach(function(b){b.removeAttribute('data-armed');b.textContent=b.getAttribute('data-label')})};
    if(el.getAttribute('data-armed')){
      var keep=act==='reset'?S.voice:{uri:'',rate:1,auto:false};
      stopSpeak();S=fresh(keep);save();renderHome();
    }else{
      disarm();el.setAttribute('data-armed','1');el.textContent='Tap again to confirm';
      clearTimeout(resetTimer);resetTimer=setTimeout(disarm,4000);
    }
  }
});
document.addEventListener('keydown',function(e){
  if(!L||$('#lesson').hidden)return;
  var tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&tag!=='button'){
    var n=$('#next');if(n){e.preventDefault();n.click();return}
    var c=$('#check');if(c&&!c.disabled){e.preventDefault();c.click()}
  }else if(/^[1-4]$/.test(e.key)&&tag!=='input'&&L.view&&!L.view.fb){
    var b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click();
  }
});

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='voiceSel'){S.voice.uri=t.value;save();speak('Hello hero.')}
  else if(t.id==='autoRead'){S.voice.auto=t.checked;save()}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='codeform')return;
  e.preventDefault();
  var r=redeemCode($('#codein').value);
  if(r.ok)renderShop(r.msg,'#codein');else setShopMsg(r.msg);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='rate'){S.voice.rate=+t.value;var rv=$('#rateval');if(rv)rv.textContent=S.voice.rate.toFixed(1)+'x';save()}
});

renderHome();
})();
</script>

</body></html>
